
server:
  servlet:
    context-path: /
  port: ${PORT:8080}

spring:
  application:
    name: papelaria


  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papelaria}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
