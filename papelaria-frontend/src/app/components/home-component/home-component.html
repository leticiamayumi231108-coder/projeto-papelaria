<div class="hero">
  <h1>Papelaria</h1>
  <svg class="hero-underline" width="150" height="12" viewBox="0 0 150 12" fill="none">
    <path d="M2 8C30 2 60 2 75 6C90 10 120 10 148 4" stroke="#D9553D" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <p>Selecione uma funcionalidade</p>
</div>

<div class="grid">
  <a *ngFor="let f of funcionalidades" class="card {{ f.classe }}" tabindex="0" [routerLink]="f.rota">
    <div class="icon-wrap" [innerHTML]="f.svg"></div>
    <h3>{{ f.titulo }}</h3>
    <p>{{ f.descricao }}</p>
  </a>
</div>

<footer>Papelaria &middot; sistema de gest&atilde;o</footer>
